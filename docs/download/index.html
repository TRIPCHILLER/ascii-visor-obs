<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Download ASCII VISOR · OBS Edition</title>
<style>
:root{color-scheme:dark;font:17px/1.6 system-ui,sans-serif;background:#0d1117;color:#e6edf3}body{max-width:760px;margin:8vh auto;padding:24px}h1{font-size:clamp(28px,6vw,42px);line-height:1.2}a{color:#9cd7ff}header{color:#9cd7ff;font-weight:700;letter-spacing:.08em}.box{border:1px solid #334655;border-radius:16px;padding:26px;margin:26px 0;background:#141e28}.button{display:inline-block;padding:13px 24px;background:#9cd7ff;color:#101820;border-radius:9px;font-weight:750;text-decoration:none}.secondary{display:block;margin-top:18px}small{color:#aab8c6}nav{display:flex;flex-wrap:wrap;gap:20px;margin:28px 0}#status{min-height:2em}#version{font-weight:650}footer{border-top:1px solid #334655;margin-top:40px;padding-top:20px}a:focus-visible{outline:3px solid white;outline-offset:5px}[hidden]{display:none!important}
</style>
<header>ASCII ⛶ VISOR · OBS EDITION</header>
<h1 id="heading">Download the latest installer</h1>
<nav aria-label="Platforms"><a href="?platform=windows">Windows</a><a href="?platform=linux">Linux</a><a href="?platform=macos">macOS</a></nav>
<main class="box">
<p id="status" role="status">Looking for the latest published package…</p>
<p id="version"></p>
<a class="button" id="download" hidden>Download installer</a>
<p id="hint"></p>
<a class="secondary" id="guide" href="https://github.com/TRIPCHILLER/ascii-visor-obs/blob/main/docs/INSTALL.en.md">Step-by-step installation guide</a>
<a class="secondary" id="releases" href="https://github.com/TRIPCHILLER/ascii-visor-obs/releases">All releases and manual downloads</a>
</main>
<footer><small id="footer">Free and open source. OBS Studio must be installed separately.</small></footer>
<noscript><p>JavaScript is disabled. Download your platform's installer from <a href="https://github.com/TRIPCHILLER/ascii-visor-obs/releases">GitHub Releases</a>.</p></noscript>
<script src="selector.js"></script>
<script>
(async()=>{
 const params=new URLSearchParams(location.search);
 const ru=params.get('lang')==='ru'||(!params.has('lang')&&navigator.language.startsWith('ru'));
 document.documentElement.lang=ru?'ru':'en';
 const platform=params.get('platform');
 const titles={windows:'Windows x64',linux:'Linux x86_64',macos:'macOS · Apple Silicon + Intel'};
 const text=ru?{
  heading:'Скачать актуальный установщик',loading:'Ищем последний опубликованный пакет…',ready:'Установщик готов к скачиванию.',
  candidate:'Предварительный релиз',stable:'Стабильный релиз',download:'Скачать установщик',guide:'Пошаговая инструкция по установке',releases:'Все релизы и ручная установка',
  error:'Не удалось автоматически получить список файлов. Откройте все релизы ниже и выберите установщик своей платформы.',
  missing:'Для этой платформы пока нет опубликованного установщика. Проверьте раздел релизов ниже.',
  choose:'Выберите Windows, Linux или macOS выше.',footer:'Бесплатный плагин с открытым кодом. OBS Studio устанавливается отдельно.',
  hints:{windows:'Закройте OBS и запустите скачанный .exe.',linux:'Разрешите выполнение AppImage в свойствах файла, затем откройте его. Ubuntu 24.04 / glibc 2.39+; OBS 32.2+.',macos:'Распакуйте ZIP и откройте ASCII VISOR Setup.app. Один пакет для Apple Silicon и Intel. Подпись локальная, без заверения Apple.'}
 }:{
  heading:'Download the latest installer',loading:'Looking for the latest published package…',ready:'Your installer is ready to download.',
  candidate:'Pre-release',stable:'Stable release',download:'Download installer',guide:'Step-by-step installation guide',releases:'All releases and manual downloads',
  error:'The file list could not be loaded automatically. Open all releases below and choose the installer for your platform.',
  missing:'No installer has been published for this platform yet. Check all releases below.',choose:'Choose Windows, Linux or macOS above.',
  footer:'Free and open source. OBS Studio must be installed separately.',
  hints:{windows:'Close OBS and run the downloaded .exe.',linux:'Allow the AppImage to run as a program, then open it. Ubuntu 24.04 / glibc 2.39+; OBS 32.2+.',macos:'Unzip the archive and open ASCII VISOR Setup.app. One package for Apple Silicon and Intel. Ad-hoc signed, without Apple notarization.'}
 };
 const el=id=>document.getElementById(id);
 for(const id of ['heading','guide','releases','footer'])el(id).textContent=text[id];
 el('guide').href='https://github.com/TRIPCHILLER/ascii-visor-obs/blob/main/docs/INSTALL.'+(ru?'ru':'en')+'.md'+(titles[platform]?'#'+platform:'');
 for(const a of document.querySelectorAll('nav a')){const u=new URL(a.href);if(ru)u.searchParams.set('lang','ru');a.href=u;}
 if(!titles[platform]){el('status').textContent=text.choose;return;}
 el('heading').textContent=title(platform);
 el('status').textContent=text.loading;
 try{
  const releases=[];
  // A newly published release may omit a platform: look for its most recent actual installer.
  // Include labelled pre-releases; draft releases and source/manual archives never qualify.
  for(let page=1;page<=3;page++){
   const response=await fetch('https://api.github.com/repos/TRIPCHILLER/ascii-visor-obs/releases?per_page=100&page='+page,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
   if(!response.ok)throw new Error('HTTP '+response.status);
   const batch=await response.json();if(!Array.isArray(batch))throw new Error('Invalid release list');
   releases.push(...batch);
   if(batch.length<100)break;
  }
  const found=VisorDownloads.selectInstaller(releases,platform);
  if(!found){el('status').textContent=text.missing;return;}
  const {release,asset}=found;
  el('status').textContent=text.ready;
  el('version').textContent=release.tag_name+' · '+(release.prerelease?text.candidate:text.stable);
  el('download').textContent=text.download+' · '+titles[platform];
  el('download').href=asset.browser_download_url;el('download').hidden=false;
  el('hint').textContent=text.hints[platform];
  el('releases').href=release.html_url;
 }catch(error){el('status').textContent=text.error;}
 function title(p){return (ru?'Установщик для ':'Installer for ')+titles[p];}
})();
</script>
</html>
