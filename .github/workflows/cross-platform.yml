name: Cross-platform preview
on:
  push:
    branches: [feature/cross-platform-obs]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS SDK and graphics test tools
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio ninja-build libsimde-dev libgles2-mesa-dev xvfb mesa-utils qt6-base-dev libx11-dev
      - run: cmake --preset ubuntu-x86_64 -DENABLE_QT=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      - run: cmake --build --preset ubuntu-x86_64 --parallel 4
      - run: ctest --test-dir build_x86_64 --output-on-failure
      - name: Render and compositing regression tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p test-results
          xvfb-run -a ./build_x86_64/visor-transparency-test "$PWD" "$PWD/test-results/composite" /usr
      - name: Package preview
        run: |
          mkdir -p preview/ascii-visor/bin/64bit
          cp build_x86_64/ascii-visor.so preview/ascii-visor/bin/64bit/
          cp -R data preview/ascii-visor/data
          cp LICENSE THIRD_PARTY.md preview/
          tar -C preview -czf ascii-visor-linux-x86_64-preview.tar.gz .
          ldd build_x86_64/ascii-visor.so
          mkdir -p preview/setup
          cp 'build_x86_64/installer/native/ASCII VISOR Setup' preview/setup/
          python3 installer/native/package.py preview/setup preview/ascii-visor
          QT_QPA_PLATFORM=offscreen 'preview/setup/ASCII VISOR Setup' --preview test-results/installer
          QT_QPA_PLATFORM=offscreen 'preview/setup/ASCII VISOR Setup' --self-test
          tar -C preview/setup -czf ascii-visor-linux-setup-preview.tar.gz .
          bash installer/native/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ascii-visor-linux-x86_64-preview
          path: |
            ascii-visor-linux-*-preview.tar.gz
            ascii-visor-linux-setup-preview.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: test-results/
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset macos -DENABLE_QT=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      - run: cmake --build --preset macos --parallel 4
      - run: ctest --test-dir build_macos -C RelWithDebInfo --output-on-failure
      - name: Inspect and package universal preview
        run: |
          bundle=build_macos/RelWithDebInfo/ascii-visor.plugin
          test -d "$bundle"
          lipo "$bundle/Contents/MacOS/ascii-visor" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$bundle"
          otool -L "$bundle/Contents/MacOS/ascii-visor"
          ditto -c -k --keepParent "$bundle" ascii-visor-macos-universal-preview.zip
          app='build_macos/installer/native/RelWithDebInfo/ASCII VISOR Setup.app'
          test -d "$app"
          python3 installer/native/package.py "$app/Contents/Resources" "$bundle"
          deploy=$(find .deps -name macdeployqt -type f | head -1)
          test -n "$deploy"
          "$deploy" "$app" -always-overwrite
          codesign --force --deep --sign - "$app"
          lipo "$app/Contents/MacOS/ASCII VISOR Setup" -verify_arch arm64 x86_64
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/ASCII VISOR Setup" --preview test-results/installer
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/ASCII VISOR Setup" --self-test
          ditto -c -k --keepParent "$app" ascii-visor-macos-setup-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ascii-visor-macos-universal-preview
          path: ascii-visor-macos-*-preview.zip
          if-no-files-found: error
      - name: Test actual OBS 32.2.2 rendering on Apple Silicon
        run: |
          curl -fL --retry 3 https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-macOS-Apple.dmg -o obs.dmg
          hdiutil attach obs.dmg -nobrowse -mountpoint "$PWD/obs-volume"
          ditto "$PWD/obs-volume/OBS.app" "$PWD/obs-runtime/OBS.app"
          hdiutil detach "$PWD/obs-volume"
          find obs-runtime/OBS.app -iname '*opengl*' -o -name default.effect
          mkdir -p test-results
          export DYLD_FRAMEWORK_PATH="$PWD/obs-runtime/OBS.app/Contents/Frameworks"
          export VISOR_TEST_GRAPHICS=$(find "$PWD/obs-runtime/OBS.app" -type f -name libobs-opengl -print -quit)
          export VISOR_TEST_OBSDATA=$(dirname "$(find "$PWD/obs-runtime/OBS.app" -name default.effect -print -quit)")
          test -n "$VISOR_TEST_GRAPHICS"
          ./build_macos/RelWithDebInfo/visor-transparency-test "$PWD" "$PWD/test-results/composite" "$PWD/obs-runtime/OBS.app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-results
          path: test-results/
